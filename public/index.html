<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleMultiServer 测试客户端</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #14161c; color: #e6e8ee; margin: 0; padding: 24px;
      display: grid; grid-template-columns: 320px 1fr; gap: 20px; min-height: 100vh;
    }
    .panel {
      background: #1d2028; border: 1px solid #2c313d; border-radius: 10px;
      padding: 16px;
    }
    h1 { font-size: 18px; margin: 0 0 16px; }
    label { display: block; font-size: 12px; color: #9aa1b0; margin: 10px 0 4px; }
    input, textarea, button {
      width: 100%; font: inherit; background: #14161c; color: #e6e8ee;
      border: 1px solid #2c313d; border-radius: 6px; padding: 8px 10px;
    }
    button { cursor: pointer; background: #2b6cb0; border-color: #2b6cb0; font-weight: 600; }
    button:hover { background: #3182ce; }
    button.secondary { background: transparent; border-color: #2c313d; }
    #status { font-size: 13px; padding: 8px 10px; border-radius: 6px; margin-bottom: 12px; }
    #status.connected { background: #173a24; color: #7be29a; }
    #status.disconnected { background: #3a1717; color: #f07f7f; }
    #log {
      width: 100%; height: 320px; resize: vertical; font-family: ui-monospace, monospace;
      font-size: 12px; line-height: 1.5; background: #101219; color: #c7f0c7;
    }
    #board { display: grid; grid-template-columns: repeat(3, 80px); gap: 8px; margin: 16px 0; }
    .cell {
      width: 80px; height: 80px; font-size: 36px; font-weight: 700; display: flex;
      align-items: center; justify-content: center; background: #14161c;
      border: 1px solid #2c313d; border-radius: 8px; cursor: pointer; user-select: none;
    }
    .cell.disabled { cursor: not-allowed; opacity: .5; }
    #gameInfo { font-size: 13px; color: #9aa1b0; margin-bottom: 8px; min-height: 18px; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>连接设置</h1>
    <div id="status" class="disconnected">未连接</div>
    <label>服务器地址</label>
    <input id="server" value="" placeholder="ws://127.0.0.1:3000/ws" />
    <label>游戏 (game)</label>
    <input id="game" value="relay" placeholder="relay / tictactoe / 任意" />
    <label>房间 (room)</label>
    <input id="room" value="default" placeholder="default" />
    <label>昵称 (name，可选)</label>
    <input id="name" placeholder="player" />
    <label>密钥 (token，若服务端设置则必填)</label>
    <input id="token" placeholder="" />
    <div class="row" style="margin-top:14px">
      <button id="btnConnect">连接</button>
      <button id="btnJoin" class="secondary" disabled>加入房间</button>
    </div>

    <h1 style="margin-top:22px">发送消息 (send)</h1>
    <label>类型 (type)</label>
    <input id="sendType" value="hello" />
    <label>参数 JSON（会被原样转发给其他玩家）</label>
    <textarea id="sendParams" rows="5">{ "text": "hi", "x": 1, "y": 2 }</textarea>
    <button id="btnSend" style="margin-top:10px" disabled>发送</button>

    <h1 style="margin-top:22px">井字棋 (game=tictactoe)</h1>
    <div id="gameInfo"></div>
    <div id="board"></div>
    <button id="btnRestart" class="secondary" disabled>重新开局</button>
  </div>

  <div class="panel">
    <h1>消息日志</h1>
    <textarea id="log" readonly></textarea>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let ws = null;
    let myId = null;
    let state = null; // tictactoe 状态

    function setStatus(text, cls) {
      const el = $('status');
      el.textContent = text;
      el.className = cls;
    }

    function log(line) {
      const el = $('log');
      const t = new Date().toLocaleTimeString();
      el.value += `[${t}] ${line}\n`;
      el.scrollTop = el.scrollHeight;
    }

    function refreshButtons() {
      const open = ws && ws.readyState === WebSocket.OPEN;
      $('btnJoin').disabled = !open;
      $('btnSend').disabled = !open;
      $('btnRestart').disabled = !(open && $('game').value === 'tictactoe');
    }

    function connect() {
      const url = $('server').value || `ws://${location.host}/ws`;
      ws = new WebSocket(url);
      setStatus('连接中…', 'disconnected');
      ws.onopen = () => { setStatus('已连接', 'connected'); log('已连接: ' + url); refreshButtons(); };
      ws.onclose = () => { setStatus('已断开', 'disconnected'); log('连接已断开'); refreshButtons(); };
      ws.onerror = () => log('连接出错');
      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { log('收到非 JSON: ' + ev.data); return; }
        handleMessage(msg);
      };
    }

    function handleMessage(msg) {
      log('收到: ' + JSON.stringify(msg));
      switch (msg.op) {
        case 'joined':
          myId = msg.you;
          log(`已加入房间 game=${msg.game} room=${msg.room}，我是 ${myId}`);
          break;
        case 'message':
          if (msg.from === 'server' && msg.type === 'state') {
            state = msg;
            renderBoard();
            renderInfo();
          }
          break;
        case 'error':
          log('错误: ' + msg.error);
          break;
        case 'closed':
          log('房间关闭: ' + msg.reason);
          state = null; renderBoard(); renderInfo();
          break;
      }
    }

    function join() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      state = null; renderBoard(); renderInfo();
      const msg = { op: 'join', game: $('game').value, room: $('room').value };
      if ($('name').value) msg.name = $('name').value;
      if ($('token').value) msg.token = $('token').value;
      ws.send(JSON.stringify(msg));
      log('发送: ' + JSON.stringify(msg));
    }

    function send() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      let params;
      try { params = JSON.parse($('sendParams').value || '{}'); } catch { return log('参数不是合法 JSON'); }
      const msg = { op: 'send', type: $('sendType').value, ...params };
      ws.send(JSON.stringify(msg));
      log('发送: ' + JSON.stringify(msg));
    }

    // ---- 井字棋渲染 ----
    function renderBoard() {
      const board = $('board');
      board.innerHTML = '';
      const cells = state && state.board ? state.board : Array(9).fill(null);
      cells.forEach((v, i) => {
        const d = document.createElement('div');
        d.className = 'cell' + (state && state.started && !state.winner && state.turnPlayerId === myId && v === null ? '' : ' disabled');
        d.textContent = v || '';
        d.onclick = () => move(i);
        board.appendChild(d);
      });
    }

    function renderInfo() {
      const el = $('gameInfo');
      if (!state) { el.textContent = '尚未加入井字棋房间'; return; }
      if (state.winner === 'draw') el.textContent = '平局！';
      else if (state.winner) el.textContent = `获胜方: ${state.winner}`;
      else if (!state.started) el.textContent = '等待另一位玩家加入…';
      else {
        const mySeat = (state.seats || []).find((s) => s.playerId === myId);
        const mySym = mySeat ? mySeat.symbol : '?';
        el.textContent = `你是 ${mySym}，${state.turnPlayerId === myId ? '轮到你了' : '等待对方落子'}`;
      }
    }

    function move(index) {
      if (!ws || ws.readyState !== WebSocket.OPEN || !state) return;
      ws.send(JSON.stringify({ op: 'send', type: 'move', index }));
    }

    function restart() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ op: 'send', type: 'restart' }));
    }

    $('btnConnect').onclick = connect;
    $('btnJoin').onclick = join;
    $('btnSend').onclick = send;
    $('btnRestart').onclick = restart;
    $('game').oninput = refreshButtons;

    $('server').value = `ws://${location.host}/ws`;
    refreshButtons();
  </script>
</body>
</html>
